<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<svg viewBox="{{ viewBox }}" width="{{ w }}" height="{{ h }}" onClick="{{ onPress }}" style="display:block">
  <rect x="0" y="0" width="100" height="{{ vh }}" fill="{{ panel }}"></rect>
  <sc-for list="{{ segs }}" as="s" hint-placeholder-count="10">
    <g>
      <rect x="{{ s.x }}" y="{{ s.y }}" width="{{ s.w }}" height="{{ s.h }}" rx="{{ s.rx }}" fill="#12161a"></rect>
      <rect x="{{ s.x }}" y="{{ s.y }}" width="{{ s.w }}" height="{{ s.h }}" rx="{{ s.rx }}" fill="{{ s.color }}" fill-opacity="{{ s.a }}" stroke="{{ s.color }}" stroke-width="{{ s.gw }}" stroke-opacity="{{ s.ga }}"></rect>
      <rect x="{{ s.hx }}" y="{{ s.hy }}" width="{{ s.hw }}" height="{{ s.hh }}" rx="{{ s.hr }}" fill="#ffffff" opacity="{{ s.hl }}"></rect>
    </g>
  </sc-for>
</svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:90,&quot;height&quot;:230},&quot;value&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:0.6,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.01,&quot;tsType&quot;:&quot;number&quot;},&quot;peak&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:0.8,&quot;min&quot;:-1,&quot;max&quot;:1,&quot;step&quot;:0.01,&quot;tsType&quot;:&quot;number&quot;},&quot;segments&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:10,&quot;min&quot;:3,&quot;max&quot;:30,&quot;tsType&quot;:&quot;number&quot;},&quot;clip&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;panel&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#6d7a85&quot;,&quot;options&quot;:[&quot;#6d7a85&quot;,&quot;#5b6570&quot;,&quot;#39434b&quot;,&quot;#181830&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;w&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:34,&quot;min&quot;:10,&quot;max&quot;:140,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;h&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:200,&quot;min&quot;:50,&quot;max&quot;:600,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;onPress&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const w = Number(this.props.w ?? 34);
    const h = Number(this.props.h ?? 200);
    const vh = Math.round((100 * h) / w);
    const n = Math.max(3, Number(this.props.segments ?? 10));
    const value = Math.max(0, Math.min(1, Number(this.props.value ?? 0)));
    const peak = Number(this.props.peak ?? -1);
    const clip = !!this.props.clip;
    const lit = Math.round(value * n);
    const peakIdx = peak >= 0 ? Math.min(n - 1, Math.round(peak * n) - 1) : -1;

    const pad = vh * 0.02;
    const pitch = (vh - pad * 2) / n;
    const segH = pitch * 0.7;
    const segs = [];
    for (let i = 0; i < n; i++) {
      const f = i / (n - 1);
      const color = f >= 0.9 ? '#ff3b30' : f >= 0.72 ? '#ffa41f' : '#3be03b';
      const y = pad + (n - 1 - i) * pitch + (pitch - segH) / 2;
      const on = i < lit || (i === peakIdx) || (clip && i >= n - 1);
      const isPeak = i === peakIdx && i >= lit;
      segs.push({
        x: 10, w: 80, y: Math.round(y * 10) / 10, h: Math.round(segH * 10) / 10, rx: segH * 0.34,
        color, a: on ? 1 : 0.17,
        gw: on ? segH * 0.7 : 0, ga: on ? (isPeak ? 0.22 : 0.34) : 0,
        hx: 18, hw: 64, hy: Math.round((y + segH * 0.18) * 10) / 10,
        hh: Math.max(0.8, segH * 0.16), hr: segH * 0.08,
        hl: on ? 0.5 : 0.06,
      });
    }
    return { w, h, vh, viewBox: `0 0 100 ${vh}`, segs, panel: this.props.panel ?? '#6d7a85', onPress: this.props.onPress };
  }
}
</script>
</body>
</html>
